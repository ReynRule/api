<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RWPH Rankings</title>
<style>
body{margin:0;padding:24px;background:#0d1117;color:#e6edf3;font:14px/1.5 -apple-system,"Segoe UI",sans-serif}
main{max-width:800px;margin:auto}
a{color:#58a6ff}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:16px;margin:14px 0}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
select,input{max-width:100%;padding:10px;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:8px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #30363d}
.num{text-align:right}
.muted{color:#8b949e}
.scroll{overflow-x:auto}
@media(max-width:500px){body{padding:14px}.controls{flex-direction:column}select,input{width:100%;box-sizing:border-box}}
</style>
</head>
<body>
<main>
<p><a href="../">← Back to RWPH Tracker</a></p>
<h1>RWPH Rankings</h1>
<p class="muted">Hourly wave gain rankings · Korea Standard Time (KST)</p>

<div class="card">
  <div class="controls">
    <label>
      Date (KST)<br>
      <input type="date" id="date">
    </label>
    <label>
      Hour (KST)<br>
      <select id="hour"></select>
    </label>
  </div>

  <p id="status" class="muted">Loading rankings...</p>

  <div class="scroll">
    <table>
      <thead>
        <tr>
          <th>Rank</th>
          <th>Player</th>
          <th class="num">Jumps</th>
          <th class="num">RWPH</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<p class="muted">Historical rankings are saved at 55 minutes past each hour.</p>
</main>

<script>
const $ = id => document.getElementById(id);
const fmt = n => Number(n || 0).toLocaleString('en-US');
const pad = n => String(n).padStart(2, '0');
const getKstDate = () =>
  new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
const getKstHour = () =>
  new Date(Date.now() + 9 * 3600000).toISOString().slice(11, 13);

let selectedDate = getKstDate();
let selectedHour = getKstHour();
let availableHours = [];

function hourKey() {
  return selectedDate + 'T' + selectedHour;
}

function hourLabel(h) {
  return h + ':00–' + pad((Number(h) + 1) % 24) + ':00 KST';
}

function renderRows(rankings) {
  $('rows').innerHTML = '';

  if (!rankings || !rankings.length) {
    $('rows').innerHTML =
      '<tr><td colspan="4">No ranking data available.</td></tr>';
    return;
  }

  rankings.forEach((r, i) => {
    const tr = document.createElement('tr');
    const values = [
      r.rank || i + 1,
      r.nick || '',
      fmt(r.jumps),
      '+' + fmt(r.speed)
    ];

    values.forEach((value, j) => {
      const td = document.createElement('td');
      td.textContent = value;
      if (j >= 2) td.className = 'num';
      tr.appendChild(td);
    });

    $('rows').appendChild(tr);
  });
}

function updateHourOptions() {
  const hourSelect = $('hour');
  hourSelect.innerHTML = '';

  const datePrefix = selectedDate + 'T';
  const hoursForDate = availableHours
    .filter(h => h.startsWith(datePrefix))
    .map(h => h.slice(11, 13));

  // 현재 시간대도 선택 가능하게 표시
  if (selectedDate === getKstDate()) {
    hoursForDate.push(getKstHour());
  }

  const uniqueHours = [...new Set(hoursForDate)].sort();

  // 스냅샷이 아직 없는 시간도 선택할 수 있도록 00~23시 제공
  for (let h = 0; h < 24; h++) {
    const value = pad(h);
    if (!uniqueHours.includes(value)) uniqueHours.push(value);
  }

  uniqueHours.sort();

  uniqueHours.forEach(h => {
    const option = document.createElement('option');
    option.value = h;
    option.textContent = hourLabel(h);
    hourSelect.appendChild(option);
  });

  if (uniqueHours.includes(selectedHour)) {
    hourSelect.value = selectedHour;
  } else {
    selectedHour = uniqueHours[uniqueHours.length - 1];
    hourSelect.value = selectedHour;
  }
}

async function loadRanking() {
  const key = hourKey();
  const now = getKstDate() + 'T' + getKstHour();

  $('status').textContent = 'Loading rankings...';

  try {
    let rankings = [];
    let label = '';

    if (key === now) {
      const res = await fetch('../data/state.json?t=' + Date.now(), {
        cache: 'no-store'
      });
      if (!res.ok) throw new Error('State HTTP ' + res.status);

      const state = await res.json();

      rankings = Object.entries(state.users || {}).map(([nick, u]) => {
        const h = (u.hours || {})[key] || {};
        const jumps = (u.jumps && u.jumps.hours &&
          u.jumps.hours[key]) || {};

        return {
          nick,
          speed: Number(h.gain) || 0,
          jumps: (Number(jumps.j10) || 0) +
                 (Number(jumps.j20) || 0) +
                 (Number(jumps.j30) || 0)
        };
      });

      label = 'Live ranking';
    } else {
      const file = '../rankdata/' +
        selectedDate + '-' + selectedHour + '.json?t=' + Date.now();

      const res = await fetch(file, { cache: 'no-store' });

      if (!res.ok) {
        renderRows([]);
        $('status').textContent =
          'No saved snapshot for ' + key.replace('T', ' ') + ' KST';
        return;
      }

      const data = await res.json();

      rankings = (data.rankings || []).map(r => ({
        nick: r.nick,
        speed: Number(r.speed) || 0,
        jumps: Number(r.jumps) || 0
      }));

      label = 'Historical ranking';
    }

    rankings.sort((a, b) =>
      b.speed - a.speed || a.nick.localeCompare(b.nick)
    );

    rankings.forEach((r, i) => {
      r.rank = i + 1;
    });

    renderRows(rankings);
    $('status').textContent =
      label + ' · ' + selectedDate + ' ' +
      hourLabel(selectedHour);
  } catch (e) {
    renderRows([]);
    $('status').textContent =
      'Could not load ranking data: ' + e.message;
  }
}

async function loadHours() {
  try {
    const res = await fetch('../rankdata/index.json?t=' + Date.now(), {
      cache: 'no-store'
    });

    if (res.ok) {
      const data = await res.json();
      availableHours = Array.isArray(data.hours) ? data.hours : [];
    }
  } catch (e) {
    // 인덱스를 읽지 못해도 날짜와 시간을 선택할 수 있다.
  }

  updateHourOptions();
  await loadRanking();
}

$('date').value = selectedDate;
$('date').max = getKstDate();

$('date').addEventListener('change', () => {
  if (!$('date').value) return;
  selectedDate = $('date').value;
  updateHourOptions();
  loadRanking();
});

$('hour').addEventListener('change', () => {
  selectedHour = $('hour').value;
  loadRanking();
});

loadHours();

setInterval(() => {
  $('date').max = getKstDate();
  loadHours();
}, 60000);

setInterval(() => {
  if (hourKey() === getKstDate() + 'T' + getKstHour()) {
    loadRanking();
  }
}, 15000);
</script>
</body>
</html>
